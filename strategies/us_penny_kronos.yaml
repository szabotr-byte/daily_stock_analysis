name: us_penny_kronos
display_name: US Penny Breakout + Kronos
description: US penny-stock screening strategy using price, market cap, volume, momentum, technical setup and optional Kronos confirmation.
version: "1"
category: breakout

tags:
  - US
  - penny
  - low_float
  - breakout
  - Kronos

analysis_skills:
  - get_daily_history
  - analyze_trend

style:
  risk_profile: aggressive
  holding_period: intraday
  execution_style: breakout
  market_regime:
    - trending_up
    - volatile
  capital_profile: speculative
  ui_badge: Penny + Kronos

screening:
  enabled: true
  market_scope:
    - us

  hard_filters:
    exclude_st: true
    price_min: 1.0
    price_max: 5.0
    market_cap_max: 300000000
    volume_ratio_min: 2.0
    change_pct_min: 3.0

  tech_weight: 0.35

  factor_weights:
    momentum: 0.20
    activity: 0.20
    technical: 0.15
    stability: 0.10

  scoring_profile:
    momentum_base: 50
    activity_ideal_volume_ratio: 2.0

  risk_profile:
    chase_change_pct: 15
    chase_points: 15
    abnormal_volume_ratio: 10
    abnormal_volume_ratio_points: 10

  ranking_hints: |
    Prefer US penny stocks with:
    - price between $1 and $5
    - market cap below $300M
    - relative volume above 2x
    - gap or daily momentum above 3%
    - low float when available
    - strong premarket volume when available
    - price above VWAP
    - EMA9 above EMA20
    - breakout above previous day high
    - a fresh and credible catalyst

    Penalize:
    - dilution
    - recent reverse splits
    - ATM offerings
    - public offerings
    - private placements
    - convertible notes
    - excessive extension from VWAP
    - weak liquidity

    Kronos is an optional confirmation layer.
    Kronos must never execute orders.

    Prefer a clear breakout setup with defined risk.
    If catalyst, volume and technical structure are not sufficiently strong,
    recommend WAIT instead of forcing a trade.

  max_output: 5
