name: Penny Scanner Test

on:
  push:
    paths:
      - "src/penny_scanner/**"
      - "tests/test_penny_scanner.py"
      - ".github/workflows/penny-scanner-test.yml"
  pull_request:
    paths:
      - "src/penny_scanner/**"
      - "tests/test_penny_scanner.py"
      - ".github/workflows/penny-scanner-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest

      - name: Run Penny Scanner tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_penny_scanner.py
